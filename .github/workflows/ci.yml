name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: fmt, clippy, test, bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install JS toolchain
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

      - name: JS tests
        run: npm test

      - name: JS lint
        run: npm run lint

      - name: Web bundle is fresh
        # rsbuild must reproduce the committed bundle and vendor CSS.
        run: |
          npm run build
          git diff --exit-code -- web/app.js web/app.js.LICENSE.txt web/vendor/
