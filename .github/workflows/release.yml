name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release rx0 (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            ext: ''
          # Intel macOS builds cross-compile from an ARM runner:
          # GitHub retired the macos-13 Intel runners, and a job pinned
          # to a dead label queues forever.
          - runner: macos-14
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            ext: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install JS toolchain
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          # Cargo.toml is the version source of truth (see `--version`).
          sed -i -e "s/^version = \".*\"$/version = \"$VER\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Bundle Web Assets
        run: npm run build

      - name: Build Release Binary
        # PowerShell (the Windows default) does not understand
        # backslash continuations or `mkdir -p`: the exe silently
        # never reached dist/ and the artifact uploaded empty.
        shell: bash
        env:
          RX0_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/rx0${{ matrix.ext }}" \
            "dist/rx0-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rx0-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/rx0-*

  desktop:
    name: Desktop installer (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Installers bundle where they run natively; the raw-binary
          # matrix above keeps covering every triple. dmg needs a GUI
          # session for its Finder layout step: hosted macOS runners
          # have one, headless SSH sessions do not.
          - runner: ubuntu-latest
            bundle: appimage
            glob: src-tauri/target/release/bundle/appimage/*.AppImage
          - runner: windows-latest
            bundle: nsis
            glob: src-tauri/target/release/bundle/nsis/*-setup.exe
          - runner: macos-14
            bundle: dmg
            glob: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install JS toolchain
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          # All three version carriers must match the tag: the bundle
          # filename comes from tauri.conf.json, metadata from the crate.
          sed -i -e "s/^version = \".*\"$/version = \"$VER\"/" Cargo.toml src-tauri/Cargo.toml
          sed -i -e "s/\"version\": \".*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          grep '^version = ' Cargo.toml src-tauri/Cargo.toml
          grep '"version": ' src-tauri/tauri.conf.json

      - name: Build Desktop Bundle
        shell: bash
        env:
          RX0_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: npm run desktop:build

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: rx0-desktop-${{ matrix.bundle }}
          path: ${{ matrix.glob }}

  publish:
    name: Create GitHub Release
    needs: [build-and-release, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        # `rx0 --update` refuses a release without checksums.txt.
        run: |
          cd dist
          sha256sum rx0-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        # `gh release upload` instead of softprops/action-gh-release:
        # the action's concurrent uploads race on their temp dir
        # ("Error creating asset temp dir") and fail the publish.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          TAG="${{ steps.get_version.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" rx0-* checksums.txt --clobber
