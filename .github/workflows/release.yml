name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release px0 (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            ext: ''
          - runner: macos-13
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            ext: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          # Cargo.toml is the version source of truth (see `--version`).
          sed -i -e "s/^version = \".*\"$/version = \"$VER\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Bundle Web Assets
        # Plain `node` (no bun): reproduces the committed bundle scheme.
        run: node ./scripts/build-web.js

      - name: Build Release Binary
        env:
          PX0_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/px0${{ matrix.ext }}" \
            "dist/px0-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: px0-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/px0-*

  publish:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        # `px0 --update` refuses a release without checksums.txt.
        run: |
          cd dist
          sha256sum px0-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/px0-*
            dist/checksums.txt
