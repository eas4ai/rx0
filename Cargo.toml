[package]
name = "rx0"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "rx0"
path = "src/main.rs"

[lib]
name = "rx0"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["compression-gzip", "set-header"] }
pulldown-cmark = "=0.10.3"
getrandom = "0.3"
libc = "0.2"
regex = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
rust-embed = "8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[profile.release]
strip = true
